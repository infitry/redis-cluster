version: '3'
services:
  redis-node-1:
    image: redis:latest
    container_name: redis-node-1
    ports:
      - "6379:6379"
    command: ["redis-server", "--cluster-enabled", "yes", "--cluster-config-file", "/data/nodes.conf", "--cluster-node-timeout", "5000"]

  redis-node-2:
    image: redis:latest
